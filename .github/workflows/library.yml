name: Refresh photo library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['library/queries.json', 'scripts/fetch-library.mjs', '.github/workflows/library.yml']
permissions:
  contents: write
concurrency: library
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fetch-library.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/library manifest.json LICENSES.md
          git diff --cached --quiet && echo "no changes" || (git commit -m "Refresh photo library" && git push)
